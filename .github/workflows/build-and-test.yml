name: Build and Test

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # Matches global.json so local, CI and the EF CLI all resolve the same runtime.
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      # RaceDay.sln now includes RaceDay.Web alongside RaceDay.Api, so this
      # one step already builds the MVC front end too - renamed so that's
      # obvious from the CI log rather than implied.
      - name: Build API and Web (Release)
        run: dotnet build --no-restore -c Release

      - name: Test (Release)
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/test-results.trx"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only, never push: proves both Dockerfiles are actually
      # buildable from the repo-root context docker-compose.yml uses, with
      # no registry login and no credentials involved at all.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RaceDay.Api/Dockerfile
          push: false
          tags: raceday-api:ci

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RaceDay.Web/Dockerfile
          push: false
          tags: raceday-web:ci
